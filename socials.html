<!DOCTYPE html>

<style>
/* ---------- Базовые стили ---------- */
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 0;
    background: #000 url('http://nekxd.ru/start.jpg') no-repeat center center fixed;
    background-size: cover;
    color: white;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow-x: auto;
    overflow-y: hidden;
    height: 100vh;
    user-select: none;
}

/* ---------- Заголовок и кнопка "Назад" ---------- */
.header-container {
    position: absolute;
    top: 45px;
    left: 85px;
    display: flex;
    align-items: center;
    gap: 20px;
    z-index: 10;
}

.back-btn {
    background: transparent;
    border: 2px solid white;
    color: white;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
}

.back-btn:hover {
    background: white;
    color: black;
}

.back-btn svg {
    width: 20px;
    height: 20px;
}

.start-header {
    font-size: 52px;
    font-weight: 200;
    letter-spacing: -1.5px;
}

/* ---------- Сетка плиток (Metro Grid) ---------- */
.tiles-container {
    display: flex;
    gap: 70px;
    height: 100%;
    align-items: flex-start;
    padding-top: 150px;
    padding-left: 85px;
    padding-right: 85px;
    padding-bottom: 40px;
    width: max-content;
}

.tile-group {
    display: grid;
    grid-template-columns: 120px 120px;
    grid-template-rows: repeat(4, 120px);
    gap: 8px;
}

/* ---------- Стили плиток ---------- */
.tile {
    position: relative;
    color: white;
    text-decoration: none;
    padding: 10px;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.1s ease;
    outline: 2px solid transparent;
    display: flex;
    flex-direction: column;
}

.tile:hover {
    outline: 2px solid rgba(255, 255, 255, 0.4);
    outline-offset: -2px;
}

.tile:active { transform: scale(0.96); }

/* Размеры */
.tile.wide { grid-column: 1 / 3; }

/* Брендовые цвета соцсетей */
.bg-telegram { background: #229ED9; }
.bg-tiktok { background: #000; }
.bg-openvk { background: #4A76A8; }
.bg-ember { background: #2ecc71; }
.bg-steam { background: #000; }
.bg-github { background: #000; }
.bg-bluesky { background: #0085ff; }
.bg-instagram { background: #2a5b83; }
.bg-discord { background: #5865F2; }
.bg-renaissance { background: #f0f3d4; }
.bg-mail { background: #444; }

/* Внутренности плитки */
.tile-title {
    position: absolute;
    bottom: 8px;
    left: 10px;
    font-size: 13.5px;
    font-weight: 400;
    max-width: calc(100% - 20px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    z-index: 2;
}

.tile-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 48px;
    height: 48px;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}

.tile-icon img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

/* Инверсия для определенных иконок (как в твоем оригинале) */
.invert-icon img { filter: invert(1); }

/* SVG-заглушки для ссылок без картинок */
.tile-icon svg { width: 32px; height: 32px; opacity: 0.9; }

/* ---------- Анимация появления ---------- */
@keyframes startScreenIn {
    0% { transform: scale(0.85) translateX(60px); opacity: 0; }
    100% { transform: scale(1) translateX(0); opacity: 1; }
}
.tile { animation: startScreenIn 0.6s cubic-bezier(0.1, 0.9, 0.2, 1) backwards; }

/* Кастомизация скроллбара */
::-webkit-scrollbar { width: 8px; height: 12px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.5); }
</style>
</head>

<script>
(function(){
    // Горизонтальный скроллинг колесиком мыши
    const container = document.querySelector('.tiles-container');
    container.addEventListener('wheel', (e) => {
        if (e.deltaY !== 0) {
            e.preventDefault();
            container.scrollLeft += e.deltaY * 2;
        }
    });

    // Анимация задержки появления плиток
    document.querySelectorAll('.tile').forEach((t, i) => {
        t.style.animationDelay = (i * 0.05) + 's';
    });
})();
</script>
