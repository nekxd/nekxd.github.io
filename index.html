<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>nekxdd's bio</title>

<style>
body{
    margin:0;
    background:#111;
    font-family:'Segoe UI',sans-serif;
    color:white;
    display:flex;
    justify-content:center;
}

.wrap{width:900px;padding:40px}

.header h1{font-size:70px;font-weight:300;margin:0}
.header p{color:#aaa;font-size:20px}

.grid{
    margin-top:30px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.tile{
    background:#0078D7;
    padding:20px;
    min-height:160px;
    cursor:pointer;
    transition:.15s;
}

.tile:hover{transform:scale(1.03)}
.tile:active{transform:scale(.97)}

.large{grid-column:span 2}
.wide{grid-column:span 2}

.green{background:#16a085}
.purple{background:#8e44ad}
.orange{background:#f39c12}

.tile h2{margin:0 0 10px;font-weight:300}
.tile p{opacity:.9}

.donate{background:#e74c3c}

footer{
    margin-top:30px;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    justify-content:center;
}
</style>
</head>

<body>

<div class="header">

<p>просто забавный челик</p>

</div>

</div>

<div class="tile orange wide" onclick="location.href='player.html'">

</div>

<div class="tile large">
