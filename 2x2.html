<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>2х2 часы</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* Прозрачный фон для OBS */
            background-color: transparent; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #clock {
            font-family: 'Impact', sans-serif;
            font-size: 120px; 
            color: #ffffff; /* Цвет часов */
            letter-spacing: 2px;
            /* Все тени и подсветки удалены */
        }
    </style>
</head>
<body>

    <!-- Стартовое значение теперь без секунд -->
    <div id="clock">00:00</div>

    <script>
        function updateClock() {
            const now = new Date();
            
            // Получаем только часы и минуты
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');

            // Обновляем текст (без секунд)
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
        }

        // Обновляем часы каждую секунду (чтобы минуты переключались вовремя)
        setInterval(updateClock, 1000);
        updateClock();
    </script>

</body>
</html>
