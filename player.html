<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Музыкальный плеер</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:'Segoe UI',sans-serif;
    display:flex;
    justify-content:center;
}

.wrap{
    width:1000px;
    padding:40px;
}

h1{
    font-size:64px;
    font-weight:300;
    margin-bottom:10px;
}

/* PLAYER */
.player{
    display:flex;
    gap:20px;
    margin-top:20px;
}

/* LEFT */
.left{
    flex:2;
    background:#1e1e1e;
    padding:20px;
}

/* RIGHT LIST */
.right{
    flex:1;
    background:#151515;
    padding:10px;
    max-height:520px;
    overflow:auto;
}

.track{
    padding:12px;
    margin-bottom:6px;
    background:#2a2a2a;
    cursor:pointer;
    transition:.2s;
}

.track:hover{
    background:#3a3a3a;
}

.track.active{
    background:#0078d7;
}

/* CONTROLS */
.controls{
    margin-top:15px;
    display:flex;
    gap:10px;
}

button{
    background:#0078d7;
    border:none;
    color:white;
    padding:10px 14px;
    cursor:pointer;
}

button:hover{
    background:#0063b1;
}

.bar{
    width:100%;
    height:6px;
    background:#333;
    margin-top:15px;
    cursor:pointer;
}

.progress{
    height:100%;
    width:0%;
    background:#0078d7;
}

/* FOOTER */
footer{
    margin-top:30px;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}
</style>
</head>

<body>

<div class="wrap">

<h1>NEKXDD Player</h1>

<div class="player">

<div class="left">

    <audio id="audio"></audio>

    <div id="now">Выбери трек</div>

    <div class="bar" onclick="seek(event)">
        <div class="progress" id="progress"></div>
    </div>

    <div class="controls">
        <button onclick="prev()">⏮</button>
        <button onclick="toggle()">⏯</button>
        <button onclick="next()">⏭</button>
    </div>

</div>

<div class="right" id="list"></div>

</div>

<footer>

<a href="http://madebydimas.top">
<img src="http://madebydimas.top/button.png" width="88" height="31">
</a>

<a href="http://myslivets.com" target="_blank">
<img src="http://myslivets.com/img/button.png" width="88" height="31">
</a>

<a href="http://veselcraft.ru/" target="_blank">
<img src="http://veselcraft.ru/images/vc.gif" width="88" height="31">
</a>

<a href="https://github.com" target="_blank">
<img src="https:/madebydimas.top/github.gif" width="88" height="31">
</a>

</footer>

</div>

<script>

const tracks = [
["Tyler The Creator - Assmilk","https://github.com/nekxd/player/raw/refs/heads/main/assmilk.mp3"],
["Kanye West - Bound 2","https://github.com/nekxd/player/raw/refs/heads/main/b2.m4a"],
["Птицу ЕМЪ - Биохазард","https://github.com/nekxd/player/raw/refs/heads/main/biohazard.m4a"],
["Grimes - Oblivion","https://github.com/nekxd/player/raw/refs/heads/main/oblivion.m4a"],
["Kanye West - Waves","https://github.com/nekxd/player/raw/refs/heads/main/waves.mp3"],
["Kunteynir - Это Жизнь","https://github.com/nekxd/player/raw/refs/heads/main/chejizh.m4a"],
["Kunteynir - Дало В Ноги","https://github.com/nekxd/player/raw/refs/heads/main/dalovnogi.m4a"],
["Tyler The Creator - She","https://github.com/nekxd/player/raw/refs/heads/main/she.m4a"]
];

let audio = document.getElementById("audio");
let list = document.getElementById("list");
let now = document.getElementById("now");
let progress = document.getElementById("progress");

let current = 0;

function load(i){
    current = i;
    audio.src = tracks[i][1];
    now.innerText = tracks[i][0];

    document.querySelectorAll(".track").forEach((t,idx)=>{
        t.classList.toggle("active", idx===i);
    });

    audio.play();
}

tracks.forEach((t,i)=>{
    let div = document.createElement("div");
    div.className="track";
    div.innerText=t[0];
    div.onclick=()=>load(i);
    list.appendChild(div);
});

function toggle(){
    if(audio.paused) audio.play();
    else audio.pause();
}

function next(){
    current = (current+1)%tracks.length;
    load(current);
}

function prev(){
    current = (current-1+tracks.length)%tracks.length;
    load(current);
}

audio.addEventListener("timeupdate",()=>{
    let p = (audio.currentTime/audio.duration)*100;
    progress.style.width = p+"%";
});

audio.addEventListener("ended",next);

function seek(e){
    let rect = e.target.getBoundingClientRect();
    let x = e.clientX - rect.left;
    let percent = x/rect.width;
    audio.currentTime = percent * audio.duration;
}

</script>

</body>
</html>
