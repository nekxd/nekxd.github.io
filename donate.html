body{
    margin:0;
    background:#111;
    color:white;
    font-family:'Segoe UI',sans-serif;
    display:flex;
    justify-content:center;
}

.wrap{
    width:900px;
    max-width:95%;
    padding:20px;
}

h1{
    font-size:60px;
    font-weight:300;
    margin:0 0 20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.tile{
    background:#0078D7;
    padding:20px;
    min-height:120px;
    box-sizing:border-box;
}

.green{
    background:#16a085;
}

.purple{
    background:#8e44ad;
}

.orange{
    background:#f39c12;
}

.red{
    background:#e74c3c;
}

.tile h2{
    margin:0 0 10px;
    font-weight:300;
}

.tile p{
    margin:0;
    line-height:1.6;
    word-wrap:break-word;
}

.back{
    display:inline-block;
    margin-top:20px;
    color:white;
}

textarea{
    width:100%;
    box-sizing:border-box;
    resize:none;
    background:#222;
    color:white;
    border:1px solid #555;
    padding:10px;
}

footer{
    margin-top:30px;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    justify-content:center;
}

footer img{
    max-width:88px;
    height:31px;
}

@media(max-width:700px){

.wrap{
    padding:15px;
}

h1{
    font-size:40px;
}

.grid{
    grid-template-columns:1fr;
}

.tile{
    width:100%;
}

footer{
    gap:8px;
}

}
</style>
